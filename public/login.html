<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login &#8212; Toko Alat Musik</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <span class="icon">🎵</span>
        <h1>Toko Alat Musik</h1>
        <p>Temukan instrumen impianmu</p>
      </div>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email atau Username</label>
          <input type="text" id="email" placeholder="admin@tokomusik.com" autocomplete="username" required>
          <div class="form-error" id="emailError"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
          <div class="form-error" id="passwordError"></div>
        </div>
        <div class="form-error" id="loginError"></div>
        <button type="submit" class="btn btn-primary btn-full btn-store-hero" id="loginBtn" style="margin-top:8px">
          Masuk
        </button>
      </form>
      <div class="demo-hint">
        <strong>Akun Demo</strong>
        admin@tokomusik.com / admin123 &nbsp;&middot;&nbsp; role: <em>admin</em><br>
        user@tokomusik.com / user123 &nbsp;&middot;&nbsp; role: <em>user</em>
      </div>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
