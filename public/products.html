<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produk &#8212; Toko Alat Musik</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="g-nav">
    <a href="products.html" class="brand">
      <span class="brand-mark">🎵</span>
      <span class="brand-name">Toko Alat Musik</span>
    </a>
    <div class="g-nav-center">
      <a href="products.html" class="nav-link active">Produk</a>
      <a href="cart.html" class="nav-link nav-cart">Keranjang<span id="cartBadge" class="cart-count">0</span></a>
      <a href="orders.html" class="nav-link">Pesanan</a>
    </div>
    <div class="g-nav-right">
      <span id="roleDisplay"></span>
      <button class="btn-nav-logout" onclick="Api.logout()">Keluar</button>
    </div>
  </nav>
  <div class="sub-nav">
    <span class="sub-nav-title">Katalog</span>
    <div class="sub-nav-actions">
      <button id="btnAddProduct" class="btn btn-primary btn-sm" style="display:none" onclick="openProductModal()">+ Tambah Produk</button>
    </div>
  </div>

  <div class="container-wide">
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Cari produk&hellip;">
      <select id="categoryFilter">
        <option value="">Semua Kategori</option>
        <option value="Gitar">Gitar</option>
        <option value="Bass">Bass</option>
        <option value="Drum & Perkusi">Drum & Perkusi</option>
        <option value="Keyboard & Piano">Keyboard & Piano</option>
        <option value="Ukulele">Ukulele</option>
        <option value="Alat Gesek">Alat Gesek</option>
        <option value="Alat Tiup">Alat Tiup</option>
        <option value="Aksesori">Aksesori</option>
      </select>
    </div>
    <div id="productsContainer">
      <div class="loading"><div class="spinner"></div> Memuat produk&hellip;</div>
    </div>
  </div>

  <!-- Admin: Product modal -->
  <div class="modal-overlay hidden" id="productModal">
    <div class="modal">
      <div class="modal-title">
        <span id="modalTitle">Tambah Produk</span>
        <button class="modal-close" onclick="closeProductModal()">&times;</button>
      </div>
      <form id="productForm" novalidate>
        <input type="hidden" id="editProductId">
        <div class="form-group">
          <label>Nama Produk</label>
          <input type="text" id="pName" required placeholder="Nama produk">
          <div class="form-error" id="pNameErr"></div>
        </div>
        <div class="form-group">
          <label>Kategori</label>
          <select id="pCategory" style="border-radius:9999px;height:44px;">
            <option value="Gitar">Gitar</option>
            <option value="Bass">Bass</option>
            <option value="Drum & Perkusi">Drum & Perkusi</option>
            <option value="Keyboard & Piano">Keyboard & Piano</option>
            <option value="Ukulele">Ukulele</option>
            <option value="Alat Gesek">Alat Gesek</option>
            <option value="Alat Tiup">Alat Tiup</option>
            <option value="Aksesori">Aksesori</option>
          </select>
        </div>
        <div class="form-group">
          <label>Deskripsi</label>
          <textarea id="pDescription" rows="3" placeholder="Deskripsi singkat produk"></textarea>
        </div>
        <div class="form-group">
          <label>Gambar Produk <span style="color:var(--ink-muted-48);font-weight:400">(opsional, maks. 5MB)</span></label>
          <div class="img-upload-zone" id="uploadZone">
            <input type="file" id="pImageFile" accept="image/jpeg,image/png,image/webp,image/gif">
            <span class="upload-icon">📷</span>
            <div class="upload-label">Klik atau seret gambar ke sini<br><strong>JPG, PNG, WebP, GIF</strong></div>
          </div>
          <div class="img-upload-preview" id="imagePreview" style="display:none">
            <img id="previewImg" src="" alt="Preview gambar produk">
            <button type="button" class="preview-remove" onclick="removeUploadedImage()" title="Hapus gambar">&times;</button>
          </div>
          <div class="upload-status" id="uploadStatus" style="display:none">
            <div class="spinner" style="width:14px;height:14px;border-width:2px"></div>
            <span>Mengunggah gambar&hellip;</span>
          </div>
          <input type="hidden" id="pImageUrl">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group">
            <label>Harga (Rp)</label>
            <input type="number" id="pPrice" min="1" placeholder="1250000">
            <div class="form-error" id="pPriceErr"></div>
          </div>
          <div class="form-group">
            <label>Stok</label>
            <input type="number" id="pStock" min="0" placeholder="10">
            <div class="form-error" id="pStockErr"></div>
          </div>
        </div>
        <div class="form-error" id="pFormErr"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary btn-sm" onclick="closeProductModal()">Batal</button>
          <button type="submit" class="btn btn-primary btn-sm" id="pSaveBtn">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="js/api.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
