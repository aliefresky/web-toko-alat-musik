<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout &#8212; Toko Alat Musik</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="g-nav">
    <a href="products.html" class="brand">
      <span class="brand-mark">🎵</span>
      <span class="brand-name">Toko Alat Musik</span>
    </a>
    <div class="g-nav-center">
      <a href="products.html" class="nav-link">Produk</a>
      <a href="cart.html" class="nav-link nav-cart">Keranjang<span id="cartBadge" class="cart-count">0</span></a>
      <a href="orders.html" class="nav-link">Pesanan</a>
    </div>
    <div class="g-nav-right">
      <span id="roleDisplay"></span>
      <button class="btn-nav-logout" onclick="Api.logout()">Keluar</button>
    </div>
  </nav>
  <div class="sub-nav">
    <span class="sub-nav-title">Checkout</span>
  </div>
  <div class="container-wide">
    <div class="checkout-layout">
      <div class="form-card">
        <div class="form-card-title">Data Penerima</div>
        <form id="checkoutForm" novalidate>
          <div class="form-group">
            <label for="recipientName">Nama Penerima</label>
            <input type="text" id="recipientName" placeholder="Nama lengkap penerima" required>
            <div class="form-error" id="recipientError"></div>
          </div>
          <div class="form-group">
            <label for="shippingAddress">Alamat Pengiriman</label>
            <textarea id="shippingAddress" rows="3" placeholder="Jl. Nama Jalan, Kota, Kode Pos" required></textarea>
            <div class="form-error" id="addressError"></div>
          </div>
          <div class="form-group">
            <label for="phone">Nomor Telepon</label>
            <input type="tel" id="phone" placeholder="08xxxxxxxxxx" required>
            <div class="form-error" id="phoneError"></div>
          </div>
          <div class="form-error" id="checkoutError"></div>
          <button type="submit" class="btn btn-primary btn-full" id="checkoutBtn" style="margin-top:8px">
            Konfirmasi Pesanan
          </button>
        </form>
      </div>
      <div>
        <div class="order-summary-card">
          <div class="form-card-title" style="margin-bottom:16px">Ringkasan Pesanan</div>
          <div id="orderSummary">
            <div class="loading"><div class="spinner"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="js/api.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
